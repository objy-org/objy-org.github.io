<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none">
  <defs>
    <marker id="apps-scene-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m2 1 6 4-6 4" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .apps-scene-float{animation:apps-scene-drift 7s ease-in-out infinite}
    .apps-scene-float-slow{animation:apps-scene-drift 9s ease-in-out -3s infinite}
    .apps-scene-float-late{animation:apps-scene-drift 8s ease-in-out -5s infinite}
    .apps-scene-current{stroke-dasharray:2 14;animation:apps-scene-flow 8s linear infinite}
    @keyframes apps-scene-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes apps-scene-flow{to{stroke-dashoffset:-64}}
    @media(prefers-reduced-motion:reduce){.apps-scene-float,.apps-scene-float-slow,.apps-scene-float-late,.apps-scene-current{animation:none}}
  </style>

  <!-- Sweeping paths connect interfaces, agents, and APIs through shared objects. -->
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" marker-end="url(#apps-scene-arrow)">
    <path d="M237 157c40-35 69-25 98 20" stroke="#d5a28b"/>
    <path d="M486 123c-36-29-73-14-88 41" stroke="#b9a2cf"/>
    <path d="M444 240c51-9 87 17 101 59" stroke="#aec198"/>
    <path d="M506 383c-53 43-132 31-171-7" stroke="#b5c79f"/>
    <path d="M233 337c-68 21-128-8-125-67" stroke="#d5a28b"/>
  </g>
  <g class="apps-scene-current" stroke-linecap="round" stroke-width="1.4" opacity=".45">
    <path d="M258 132c17-39 42-57 64-53" stroke="#b9a2cf"/>
    <path d="M322 282c-20 13-30 24-34 39" stroke="#d5a28b"/>
    <path d="M429 288c18 18 28 35 19 54" stroke="#b9a2cf"/>
  </g>

  <!-- A light, tilted app window, with a second view peeking out behind it. -->
  <g class="apps-scene-float">
    <g transform="rotate(-9 151 185)" stroke-linecap="round" stroke-linejoin="round">
      <rect x="61" y="112" width="192" height="130" rx="12" fill="#252321" stroke="#8f7061" stroke-width="1.2"/>
      <rect x="50" y="123" width="192" height="130" rx="12" fill="#292623" stroke="#d9aa93" stroke-width="1.8"/>
      <path d="M51 151h190" stroke="#806454" stroke-width="1.2"/>
      <g fill="#c89c85"><circle cx="66" cy="137" r="2.4"/><circle cx="76" cy="137" r="2.4"/><circle cx="86" cy="137" r="2.4"/></g>
      <path d="M115 137h72" stroke="#806454" stroke-width="2"/>
      <rect x="66" y="168" width="62" height="66" rx="8" fill="#333c2c" stroke="#9caf85" stroke-width="1.2"/>
      <circle cx="97" cy="191" r="10" fill="#b4c89b" fill-opacity=".65"/>
      <path d="M84 216h26" stroke="#b4c89b" stroke-width="2.5"/>
      <rect x="143" y="168" width="82" height="40" rx="8" fill="#342e3b" stroke="#9f88b7" stroke-width="1.1"/>
      <path d="m154 195 15-10 12 7 14-14 18 5" stroke="#c4acd9" stroke-width="2"/>
      <path d="M145 222h34m10 0h34" stroke="#ba9682" stroke-width="3" opacity=".6"/>
      <text x="146" y="287" fill="#dcbaa8" font-family="Montserrat, Arial, sans-serif" font-size="24" text-anchor="middle" stroke="none" data-copy="application-diagram.apps">Apps</text>
    </g>
  </g>

  <!-- A small team of agents, connected without rigid enclosing cards. -->
  <g class="apps-scene-float-slow">
    <g transform="rotate(7 572 125)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M516 91c6 15 12 22 27 24m60 1c15 0 24-9 36-22" stroke="#887499" stroke-width="1.4"/>
      <rect x="480" y="61" width="43" height="36" rx="11" fill="#2b2730" stroke="#9882ae" stroke-width="1.4"/>
      <path d="M493 76v4m17-4v4" stroke="#c1a9d8" stroke-width="3"/>
      <rect x="636" y="66" width="40" height="34" rx="11" fill="#2b2730" stroke="#9882ae" stroke-width="1.4"/>
      <path d="M648 80v4m16-4v4" stroke="#c1a9d8" stroke-width="3"/>
      <rect x="537" y="92" width="73" height="61" rx="18" fill="#302a37" stroke="#c4acd9" stroke-width="1.8"/>
      <path d="M573 91V80" stroke="#b59acb" stroke-width="1.5"/>
      <circle cx="573" cy="77" r="3.5" fill="#c9b1df"/>
      <path d="M557 114v7m32-7v7" stroke="#dac7eb" stroke-width="4"/>
      <path d="M561 136q12 6 24 0" stroke="#bda3d4" stroke-width="1.8"/>
      <path d="m614 39 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z" fill="#c5afd8" stroke="none"/>
      <text x="572" y="194" fill="#cbb7de" font-family="Montserrat, Arial, sans-serif" font-size="24" text-anchor="middle" stroke="none" data-copy="application-diagram.agents">AI agents</text>
    </g>
  </g>

  <!-- Objects remain open JSON shapes, shared by every kind of application. -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">
    <g class="apps-scene-float-late">
      <text x="370" y="253" transform="rotate(-12 370 228)" fill="#edbba6" font-size="88">{ }</text>
    </g>
    <g class="apps-scene-float-slow">
      <text x="361" y="91" transform="rotate(12 361 77)" fill="#bba4d2" font-size="44">{ }</text>
      <text x="280" y="370" transform="rotate(12 280 350)" fill="#c2d3aa" font-size="60">[ ]</text>
    </g>
    <g class="apps-scene-float">
      <text x="437" y="365" transform="rotate(-8 437 351)" fill="#b9a1d0" font-size="36">{ }</text>
    </g>
  </g>

  <!-- An API endpoint joins the same flow of objects. -->
  <g class="apps-scene-float-late">
    <g transform="rotate(9 571 352)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M505 350h18m95 0h19" stroke="#8ea27c" stroke-width="1.5"/>
      <circle cx="500" cy="350" r="4" stroke="#afc499" stroke-width="1.5"/>
      <circle cx="642" cy="350" r="4" stroke="#afc499" stroke-width="1.5"/>
      <rect x="523" y="311" width="95" height="78" rx="19" fill="#2c3328" stroke="#b8cca1" stroke-width="1.8"/>
      <path d="m549 337-13 12 13 12m43-24 13 12-13 12m-13-31-16 38" stroke="#d0dfbd" stroke-width="2.5"/>
      <text x="571" y="424" fill="#c0d1a9" font-family="Montserrat, Arial, sans-serif" font-size="24" text-anchor="middle" stroke="none" data-copy="application-diagram.apis">APIs</text>
    </g>
  </g>

  <g stroke-linecap="round" opacity=".55">
    <path d="m42 107 24-5m-20-9 12-2" stroke="#b78b75" stroke-width="1.2"/>
    <path d="m633 414 19 5m-20 8 10 3" stroke="#9aac88" stroke-width="1.2"/>
    <circle cx="287" cy="216" r="2.3" fill="#d6ac97"/>
    <circle cx="468" cy="74" r="2" fill="#bfa8d6"/>
    <circle cx="375" cy="429" r="2.5" fill="#b9cba0"/>
  </g>
</svg>
