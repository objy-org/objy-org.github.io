<svg xmlns="http://www.w3.org/2000/svg" class="objy-object-engine" width="100%" fill="none" font-family="Montserrat, Arial, sans-serif">
  <style>
    .objy-object-engine { aspect-ratio: 720 / 480; }
    .objy-object-engine .object-engine-compact { display: none; }
    @media (max-width: 640px) {
      .objy-object-engine { aspect-ratio: 420 / 560; }
      .objy-object-engine .object-engine-wide { display: none; }
      .objy-object-engine .object-engine-compact { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      .objy-object-engine .object-engine-pulse { display: none; }
    }
  </style>
  <defs>
    <!-- Shared planes give the main object depth without exposing storage internals. -->
    <g id="objy-engine-plane" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
      <path d="m288 8 7 6v214l-7-6Z" fill="#242424"/>
      <path d="m8 228 7 6h273l-7-6Z" fill="#242424"/>
      <rect width="288" height="228" rx="7" fill="inherit"/>
      <path d="M0 44h288" opacity=".45"/>
    </g>
    <g id="objy-engine-database">
      <g transform="matrix(1 -.09 0 1 32 16)" color="#526476" fill="#242a30">
        <use href="#objy-engine-plane"/>
        <path d="M20 23h46m180 0h20" stroke="#88abc5" stroke-width="2" opacity=".65"/>
      </g>
      <g transform="matrix(1 -.09 0 1 16 32)" color="#756783" fill="#2b2730">
        <use href="#objy-engine-plane"/>
        <path d="M20 23h46m180 0h20" stroke="#b9a2cf" stroke-width="2" opacity=".7"/>
      </g>
      <g class="engine-object" transform="matrix(1 -.09 0 1 0 48)" color="#b68c78" fill="#2b2724">
        <use href="#objy-engine-plane"/>
        <text x="22" y="29" fill="#edc1ab" font-size="18" font-weight="600" letter-spacing=".3">objy.db</text>
        <circle cx="240" cy="23" r="3" fill="#b5ca9e"/>
        <text x="256" y="28" fill="#b8c9a9" font-size="11">JSON</text>
        <g class="engine-json" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15.5">
          <text x="22" y="77" fill="#c9c4bc">{</text>
          <text x="37" y="103" fill="#e5b69e" data-copy="application-diagram.json-identity">&quot;_id&quot;: &quot;item-01&quot;,</text>
          <text x="37" y="129" fill="#e5b69e" data-copy="application-diagram.json-name">&quot;name&quot;: &quot;Orbit&quot;,</text>
          <text x="37" y="155" fill="#bbcca6" data-copy="application-diagram.json-tags">&quot;tags&quot;: [&quot;new&quot;, &quot;blue&quot;],</text>
          <text x="37" y="181" fill="#c6b2dc" data-copy="application-diagram.json-vector">&quot;_vec&quot;: [0.2, 0.8, 0.4]</text>
          <text x="22" y="207" fill="#c9c4bc">}</text>
        </g>
      </g>
    </g>

    <!-- Two quieter copies of the object stack suggest a distributed engine. -->
    <g id="objy-engine-node" stroke="#627689" stroke-width="1.1" stroke-linejoin="round">
      <rect x="14" width="62" height="48" rx="4" fill="#22272b"/>
      <rect x="7" y="7" width="62" height="48" rx="4" fill="#25292d"/>
      <rect y="14" width="62" height="48" rx="4" fill="#262b2f"/>
      <path d="M0 28h62" opacity=".5"/>
      <path d="M22 36h-3v4l-3 3 3 3v4h3m18-14h3v4l3 3-3 3v4h-3" stroke="#a1b9cb"/>
    </g>

    <!-- Smaller, precise endpoint icons keep attention on the object database. -->
    <g id="objy-engine-apps" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="1" width="102" height="74" rx="7" fill="#292623" stroke="#b58d77" stroke-width="1.4"/>
      <path d="M6 20h100" stroke="#806b5c" stroke-width="1.2"/>
      <circle cx="16" cy="11" r="1.8" fill="#d6a990"/>
      <circle cx="24" cy="11" r="1.8" fill="#d6a990"/>
      <path d="M17 32h26v30H17Z" fill="#30352a" stroke="#a2b38c" stroke-width="1.2"/>
      <path d="m55 52 10-10 11 5 17-17m-38 34h38" stroke="#b9a2cf" stroke-width="1.4"/>
      <text x="56" y="101" text-anchor="middle" fill="#d2b09c" font-size="18" data-copy="application-diagram.apps">Apps</text>
    </g>
    <g id="objy-engine-agents" stroke="#b9a2cf" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m56 12-25 23 25 24 25-24-25-23Z" fill="#2d2834"/>
      <path d="M56 24v23m-11-11h22M31 35H16m65 0h15M56 12V2m0 57v12"/>
      <circle cx="12" cy="35" r="4" fill="#26232c"/>
      <circle cx="100" cy="35" r="4" fill="#26232c"/>
      <circle cx="56" cy="75" r="4" fill="#26232c"/>
      <text x="56" y="101" text-anchor="middle" stroke="none" fill="#c7b3dd" font-size="18" data-copy="application-diagram.agents">AI agents</text>
    </g>
    <g id="objy-engine-apis" stroke="#b5ca9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="3" width="80" height="68" rx="7" fill="#2a3027"/>
      <path d="M2 24h14m80 0h14M2 50h14m80 0h14m-70-25-12 12 12 12m32-24 12 12-12 12m-11-32-11 40"/>
      <text x="56" y="101" text-anchor="middle" stroke="none" fill="#bdcda9" font-size="18" data-copy="application-diagram.apis">APIs</text>
    </g>
  </defs>

  <svg class="object-engine-wide" viewBox="0 0 720 480" width="100%" height="100%" aria-hidden="true">
    <g stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path id="objy-engine-wide-app-link" d="M135 244h36q14 0 14 14h23" stroke="#a78571"/>
      <path id="objy-engine-wide-agent-link" d="M584 95h-35q-14 0-14 14v63q0 14-14 14h-14" stroke="#9a86b0"/>
      <path id="objy-engine-wide-api-link" d="M628 363v-23q0-14-14-14H497" stroke="#91a37e"/>
      <path d="M225 90h31q14 0 14 14v28m253 127h35" stroke="#526777"/>
    </g>
    <g class="engine-scale-nodes" opacity=".7">
      <use href="#objy-engine-node" transform="translate(155 38)"/>
      <use href="#objy-engine-node" transform="translate(558 232)"/>
    </g>
    <use class="engine-database" href="#objy-engine-database" transform="translate(196 124)"/>
    <use href="#objy-engine-apps" transform="translate(28 206)"/>
    <use href="#objy-engine-agents" transform="translate(572 60)"/>
    <use href="#objy-engine-apis" transform="translate(572 360)"/>
    <g class="object-engine-pulse">
      <circle r="2.5" fill="#e0b39a"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#objy-engine-wide-app-link"/></animateMotion></circle>
      <circle r="2.5" fill="#c9b2df"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#objy-engine-wide-agent-link"/></animateMotion></circle>
      <circle r="2.5" fill="#c1d3ab"><animateMotion dur="5.5s" begin="-3s" repeatCount="indefinite"><mpath href="#objy-engine-wide-api-link"/></animateMotion></circle>
    </g>
  </svg>

  <svg class="object-engine-compact" viewBox="0 0 420 560" width="100%" height="100%" aria-hidden="true">
    <g stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path id="objy-engine-phone-app-link" d="M64 416v-35q0-13 13-13h17v-45" stroke="#a78571"/>
      <path id="objy-engine-phone-agent-link" d="M202 416v-99" stroke="#9a86b0"/>
      <path id="objy-engine-phone-api-link" d="M342 416v-35q0-13-13-13h-19v-65" stroke="#91a37e"/>
      <path d="M78 76v25m275 197h24" stroke="#526777"/>
    </g>
    <g class="engine-scale-nodes" opacity=".65">
      <use href="#objy-engine-node" transform="translate(20 22) scale(.8)"/>
      <use href="#objy-engine-node" transform="translate(352 271) scale(.65)"/>
    </g>
    <use class="engine-database" href="#objy-engine-database" transform="translate(46 65)"/>
    <use href="#objy-engine-apps" transform="translate(16 416) scale(.86)"/>
    <use href="#objy-engine-agents" transform="translate(154 416) scale(.86)"/>
    <use href="#objy-engine-apis" transform="translate(294 416) scale(.86)"/>
    <g class="object-engine-pulse">
      <circle r="2.5" fill="#e0b39a"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#objy-engine-phone-app-link"/></animateMotion></circle>
      <circle r="2.5" fill="#c9b2df"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#objy-engine-phone-agent-link"/></animateMotion></circle>
      <circle r="2.5" fill="#c1d3ab"><animateMotion dur="5.5s" begin="-3s" repeatCount="indefinite"><mpath href="#objy-engine-phone-api-link"/></animateMotion></circle>
    </g>
  </svg>
</svg>
