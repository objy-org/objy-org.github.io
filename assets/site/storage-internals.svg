<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" fill="none">
  <g font-family="Montserrat, Arial, sans-serif" stroke-linejoin="round">
    <text x="48" y="24" fill="#d6d2cb" font-size="20" data-copy="storage-diagram.outside">The object you work with</text>

    <!-- The intact outer shell, lifted above its internal view. -->
    <path d="m48 64 22-20h544l-22 20Z" fill="#30302e" stroke="#77716a" stroke-width="1.2"/>
    <path d="m592 64 22-20v232l-22 20Z" fill="#292927" stroke="#77716a" stroke-width="1.2"/>
    <rect x="48" y="64" width="544" height="232" fill="#252525" stroke="#8b847b" stroke-width="1.2"/>
    <text x="568" y="92" fill="#aaa69f" font-size="14" text-anchor="end" data-copy="storage-diagram.format">JSON</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">
      <text x="80" y="105" fill="#d6d2cb">{</text>
      <text x="102" y="137" fill="#c3d5af" data-copy="storage-diagram.json-identity">&quot;_id&quot;: &quot;bike-001&quot;,</text>
      <text x="102" y="166" fill="#c3d5af" data-copy="storage-diagram.json-name">&quot;name&quot;: &quot;City bike&quot;,</text>
      <text x="102" y="195" fill="#e7b0a5" data-copy="storage-diagram.json-price">&quot;price&quot;: 199,</text>
      <text x="102" y="224" fill="#c7b8df" data-copy="storage-diagram.json-notes">&quot;notes&quot;: &quot;Everyday rides&quot;</text>
      <text x="80" y="256" fill="#d6d2cb">}</text>
    </g>

    <!-- Matching edges connect two views of the same object. -->
    <g stroke="#77716a" stroke-width="1.2" stroke-dasharray="3 7" opacity=".65">
      <path d="M48 306v102M592 306v102M614 286v102"/>
    </g>
    <text x="320" y="349" fill="#aaa69f" font-size="16" text-anchor="middle" data-copy="storage-diagram.cutaway">The same object, opened up</text>
    <path d="M320 368v22m-5-5 5 5 5-5" stroke="#9d9589" stroke-width="1.3" stroke-linecap="round"/>

    <!-- The exposed memory compartments sit inside the matching shell. -->
    <path d="m48 418 22-20h544l-22 20Z" fill="#30342c" stroke="#777d6b" stroke-width="1.2"/>
    <path d="m592 418 22-20v250l-22 20Z" fill="#282c26" stroke="#777d6b" stroke-width="1.2"/>
    <rect x="48" y="418" width="544" height="250" fill="#222522" stroke="#8c9380" stroke-width="1.2"/>
    <text x="70" y="448" fill="#e5e8dc" font-size="18" data-copy="storage-diagram.inside">Inside objy.db</text>
    <text x="570" y="447" fill="#aebba0" font-size="14" text-anchor="end" data-copy="storage-diagram.memory">IN MEMORY</text>

    <rect x="68" y="468" width="504" height="54" rx="5" fill="#2b3027"/>
    <g stroke="#bdd1aa" stroke-width="2" stroke-linecap="round"><path d="M84 481h23M84 494h31M84 507h18"/></g>
    <text x="132" y="491" fill="#d4e3c4" font-size="20" data-copy="storage-diagram.hot">Hot fields</text>
    <text x="132" y="511" fill="#b9cba5" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" data-copy="storage-diagram.hot-fields">_id, name</text>
    <g stroke="#9eae8e" stroke-width="1.2">
      <rect x="444" y="480" width="108" height="12" rx="3"/>
      <rect x="444" y="501" width="74" height="10" rx="3"/>
      <path d="M452 486h36M452 506h20"/>
    </g>

    <rect x="68" y="530" width="504" height="54" rx="5" fill="#322b28"/>
    <g fill="#d9a296"><rect x="84" y="543" width="8" height="28" rx="1"/><rect x="96" y="543" width="8" height="28" rx="1"/><rect x="108" y="543" width="8" height="28" rx="1"/></g>
    <text x="132" y="553" fill="#edc4ba" font-size="20" data-copy="storage-diagram.columns">Compact columns</text>
    <text x="132" y="573" fill="#d8a296" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" data-copy="storage-diagram.column-field">price</text>
    <rect x="444" y="537" width="108" height="8" rx="2" fill="#b78376" opacity=".2"/>
    <rect x="444" y="549" width="108" height="22" rx="3" fill="#c28d80"/>
    <text x="498" y="566" fill="#211b18" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" data-copy="storage-diagram.column-value">199</text>
    <rect x="444" y="575" width="108" height="5" rx="2" fill="#b78376" opacity=".2"/>

    <rect x="68" y="592" width="504" height="54" rx="5" fill="#2e2a34"/>
    <g stroke="#bfafd7" stroke-width="2" stroke-linecap="round"><path d="M84 607h31M84 615h31M84 623h31M84 631h31"/></g>
    <text x="132" y="615" fill="#d8cce9" font-size="20" data-copy="storage-diagram.compressed">Compressed fields</text>
    <text x="132" y="635" fill="#bbacd2" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" data-copy="storage-diagram.compressed-field">notes</text>
    <g stroke="#b7a5cf" stroke-width="3" stroke-linecap="round"><path d="M446 606h104M446 614h76M446 622h96M446 630h58"/></g>
    <text x="320" y="710" fill="#aaa69f" font-size="16" text-anchor="middle" data-copy="storage-diagram.reads">One object in. One object out.</text>
  </g>
</svg>
