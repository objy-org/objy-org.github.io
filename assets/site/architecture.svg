      <rect x=".7" y=".7" width="190.6" height="64.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 20.0) scale(0.85)" stroke="#cfb5ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="m6 23 10-15 11 17m-11-17 15-3"/>
        <circle cx="6" cy="23" r="3"/>
        <circle cx="16" cy="8" r="3"/>
        <circle cx="27" cy="25" r="3"/>
        <circle cx="31" cy="5" r="3"/>
      </g>
      <text x="58" y="40.7" font-size="22" fill="#cfb5ee" data-copy="architecture-diagram.vector">Vector</text>
    </g>
    <g stroke="#74746c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
