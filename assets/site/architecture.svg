<svg xmlns="http://www.w3.org/2000/svg" class="objy-architecture" width="100%" fill="none" font-family="Montserrat, Arial, sans-serif">
  <style>
    .objy-architecture { aspect-ratio: 1000 / 680; }
    .objy-architecture .architecture-compact { display: none; }
    @media (max-width: 640px) {
      .objy-architecture { aspect-ratio: 360 / 700; }
      .objy-architecture .architecture-wide { display: none; }
      .objy-architecture .architecture-compact { display: block; }
    }
  </style>
  <defs>
    <g id="objy-arch-card" stroke="currentColor" stroke-linejoin="round">
      <path d="M400 0l10 9v240l-10-9Z" fill="#302f2b"/>
      <path d="M0 240l10 9h400l-10-9Z" fill="#21221f"/>
      <rect width="400" height="240" rx="3" fill="inherit" stroke-width="1.3"/>
      <path d="M0 48h400" opacity=".45"/>
    </g>
    <g id="objy-arch-person" class="object-snippet" fill="#292522" color="#8f7163">
      <use href="#objy-arch-card"/>
      <text x="22" y="31" font-size="18" fill="#e4b29d" data-copy="architecture-diagram.person-collection">people</text>
      <text x="378" y="31" text-anchor="end" font-size="14" fill="#aaa49d">JSON</text>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#e4b29d">
        <text x="24" y="84" fill="#ccc5bb">{</text>
        <text x="44" y="112" data-copy="architecture-diagram.person-id">&quot;_id&quot;: &quot;person-42&quot;,</text>
        <text x="44" y="140" data-copy="architecture-diagram.person-name">&quot;name&quot;: &quot;Alex&quot;,</text>
        <text x="44" y="168" data-copy="architecture-diagram.person-role">&quot;role&quot;: &quot;pilot&quot;</text>
        <text x="24" y="196" fill="#ccc5bb">}</text>
      </g>
    </g>
    <g id="objy-arch-memory" class="object-snippet" fill="#28242d" color="#7c6a8d">
      <use href="#objy-arch-card"/>
      <text x="22" y="31" font-size="18" fill="#cfb5ee" data-copy="architecture-diagram.memory-collection">memories</text>
      <text x="378" y="31" text-anchor="end" font-size="14" fill="#aaa49d">JSON</text>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#cfb5ee">
        <text x="24" y="84" fill="#ccc5bb">{</text>
        <text x="44" y="112" data-copy="architecture-diagram.memory-id">&quot;_id&quot;: &quot;memory-01&quot;,</text>
        <text x="44" y="140" data-copy="architecture-diagram.memory-title">&quot;title&quot;: &quot;First flight&quot;,</text>
        <text x="44" y="168" data-copy="architecture-diagram.memory-vector">&quot;_vec&quot;: [0.2, 0.8, 0.4]</text>
        <text x="24" y="196" fill="#ccc5bb">}</text>
      </g>
    </g>
    <g id="objy-arch-device" class="object-snippet" fill="#252922" color="#859174">
      <use href="#objy-arch-card"/>
      <text x="22" y="31" font-size="18" fill="#c5dca5" data-copy="architecture-diagram.device-collection">devices</text>
      <text x="378" y="31" text-anchor="end" font-size="14" fill="#aaa49d">JSON</text>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#c5dca5">
        <text x="24" y="84" fill="#ccc5bb">{</text>
        <text x="44" y="112" data-copy="architecture-diagram.device-id">&quot;_id&quot;: &quot;drone-01&quot;,</text>
        <text x="44" y="140" data-copy="architecture-diagram.device-name">&quot;name&quot;: &quot;Survey drone&quot;,</text>
        <text x="44" y="168" data-copy="architecture-diagram.device-status">&quot;status&quot;: &quot;ready&quot;,</text>
        <text x="44" y="196" data-copy="architecture-diagram.device-battery">&quot;battery&quot;: 87</text>
        <text x="24" y="224" fill="#ccc5bb">}</text>
      </g>
    </g>
  </defs>
  <svg class="architecture-wide" viewBox="0 0 1000 680" width="100%" height="100%" aria-hidden="true">
    <g transform="translate(80 22)">
      <rect x=".7" y=".7" width="190.6" height="64.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 20.0) scale(0.85)" stroke="#c5dca5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M8 14h20m-10-10v20m-8-14-4 4 4 4m16-8 4 4-4 4"/>
      </g>
      <text x="58" y="40.7" font-size="22" fill="#c5dca5" data-copy="architecture-diagram.crud">CRUD</text>
    </g>
    <g transform="translate(296 22)">
      <rect x=".7" y=".7" width="190.6" height="64.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 20.0) scale(0.85)" stroke="#a9d0eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="14" cy="12" r="8"/>
        <path d="m20 18 8 8m-18-14h8"/>
      </g>
      <text x="58" y="40.7" font-size="22" fill="#a9d0eb" data-copy="architecture-diagram.query">Query</text>
    </g>
    <g transform="translate(512 22)">
      <rect x=".7" y=".7" width="190.6" height="64.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 20.0) scale(0.85)" stroke="#e4b29d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M5 27V16h5v11m7 0V9h5v18m7 0V3h5v24"/>
      </g>
      <text x="58" y="40.7" font-size="22" fill="#e4b29d" data-copy="architecture-diagram.aggregate">Aggregate</text>
    </g>
    <g transform="translate(728 22)">
      <rect x=".7" y=".7" width="190.6" height="64.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 20.0) scale(0.85)" stroke="#cfb5ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="m6 23 10-15 11 17m-11-17 15-3"/>
        <circle cx="6" cy="23" r="3"/>
        <circle cx="16" cy="8" r="3"/>
        <circle cx="27" cy="25" r="3"/>
        <circle cx="31" cy="5" r="3"/>
      </g>
      <text x="58" y="40.7" font-size="22" fill="#cfb5ee" data-copy="architecture-diagram.vector">Vector</text>
    </g>
    <g stroke="#74746c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M176 88v25h648V88m-432 0v25m216-25v25M500 113v35m-5-5 5 5 5-5"/>
    </g>
    <g class="object-stack">
      <use href="#objy-arch-person" transform="matrix(1 -.08 0 1 80 210)"/>
      <use href="#objy-arch-memory" transform="matrix(1 -.08 0 1 510 190)"/>
      <use href="#objy-arch-device" transform="matrix(1 -.08 0 1 295 415)"/>
    </g>
  </svg>
  <svg class="architecture-compact" viewBox="0 0 360 700" width="100%" height="100%" aria-hidden="true">
    <g transform="translate(24 14)">
      <rect x=".7" y=".7" width="150.6" height="50.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 13.0) scale(0.65)" stroke="#c5dca5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M8 14h20m-10-10v20m-8-14-4 4 4 4m16-8 4 4-4 4"/>
      </g>
      <text x="47" y="31.95" font-size="17" fill="#c5dca5" data-copy="architecture-diagram.crud">CRUD</text>
    </g>
    <g transform="translate(184 14)">
      <rect x=".7" y=".7" width="150.6" height="50.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 13.0) scale(0.65)" stroke="#a9d0eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="14" cy="12" r="8"/>
        <path d="m20 18 8 8m-18-14h8"/>
      </g>
      <text x="47" y="31.95" font-size="17" fill="#a9d0eb" data-copy="architecture-diagram.query">Query</text>
    </g>
    <g transform="translate(24 78)">
      <rect x=".7" y=".7" width="150.6" height="50.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 13.0) scale(0.65)" stroke="#e4b29d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M5 27V16h5v11m7 0V9h5v18m7 0V3h5v24"/>
      </g>
      <text x="47" y="31.95" font-size="17" fill="#e4b29d" data-copy="architecture-diagram.aggregate">Aggregate</text>
    </g>
    <g transform="translate(184 78)">
      <rect x=".7" y=".7" width="150.6" height="50.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 13.0) scale(0.65)" stroke="#cfb5ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="m6 23 10-15 11 17m-11-17 15-3"/>
        <circle cx="6" cy="23" r="3"/>
        <circle cx="16" cy="8" r="3"/>
        <circle cx="27" cy="25" r="3"/>
        <circle cx="31" cy="5" r="3"/>
      </g>
      <text x="47" y="31.95" font-size="17" fill="#cfb5ee" data-copy="architecture-diagram.vector">Vector</text>
    </g>
    <path d="M100 132v16h160v-16m-80 16v22m-5-5 5 5 5-5" stroke="#74746c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="object-stack">
      <use href="#objy-arch-person" transform="matrix(.72 -.0576 0 .72 20 196)"/>
      <use href="#objy-arch-memory" transform="matrix(.72 -.0576 0 .72 52 352)"/>
      <use href="#objy-arch-device" transform="matrix(.72 -.0576 0 .72 20 508)"/>
    </g>
  </svg>
</svg>
