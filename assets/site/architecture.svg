      <text x="100" y="619" font-size="14" fill="#b2afaa" data-copy="storage-diagram.inside">Inside objy.db</text>
      <text x="900" y="619" text-anchor="end" font-size="12" fill="#b2afaa" data-copy="storage-diagram.memory">IN MEMORY</text>
      <g class="storage-tier" transform="translate(100 636)">
        <rect width="252" height="76" rx="4" fill="#2a3025" stroke="#647352"/>
        <use href="#objy-arch-hot" transform="translate(16 26)" color="#bdd2a5"/>
        <text x="56" y="45" font-size="17" fill="#c5dca5" data-copy="storage-diagram.hot">Hot fields</text>
      </g>
      <g class="storage-tier" transform="translate(374 636)">
