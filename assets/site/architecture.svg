<svg xmlns="http://www.w3.org/2000/svg" class="objy-architecture" width="100%" fill="none" font-family="Montserrat, Arial, sans-serif">
  <style>
    .objy-architecture { aspect-ratio: 1000 / 760; }
    .objy-architecture .architecture-compact { display: none; }
    @media (max-width: 640px) {
      .objy-architecture { aspect-ratio: 360 / 670; }
      .objy-architecture .architecture-wide { display: none; }
      .objy-architecture .architecture-compact { display: block; }
    }
  </style>
  <defs>
