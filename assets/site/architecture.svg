      <use href="#objy-arch-memory" transform="matrix(.9 -.072 0 .9 510 156)"/>
      <use href="#objy-arch-device" transform="matrix(.9 -.072 0 .9 320 346)"/>
    </g>
    <path d="M500 565v15m-5-5 5 5 5-5" stroke="#74746c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
