    </g>
    <g transform="translate(184 78)">
      <rect x=".7" y=".7" width="150.6" height="50.6" rx="12" fill="#262626" stroke="#41413d"/>
      <g transform="translate(15 13.0) scale(0.65)" stroke="#cfb5ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="m6 23 10-15 11 17m-11-17 15-3"/>
        <circle cx="6" cy="23" r="3"/>
        <circle cx="16" cy="8" r="3"/>
        <circle cx="27" cy="25" r="3"/>
        <circle cx="31" cy="5" r="3"/>
      </g>
      <text x="47" y="31.95" font-size="17" fill="#cfb5ee" data-copy="architecture-diagram.vector">Vector</text>
