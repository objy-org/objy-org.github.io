<svg xmlns="http://www.w3.org/2000/svg" class="objy-architecture" width="100%" fill="none" font-family="Montserrat, Arial, sans-serif">
  <style>
    .objy-architecture { aspect-ratio: 1000 / 900; }
    .objy-architecture .architecture-compact { display: none; }
    @media (max-width: 640px) {
      .objy-architecture { aspect-ratio: 360 / 1130; }
      .objy-architecture .architecture-wide { display: none; }
      .objy-architecture .architecture-compact { display: block; }
    }
  </style>
  <defs>
    <g id="objy-arch-ram" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="28" height="18" rx="2"/>
      <path d="M5 8h5v8H5zm10 0h5v8h-5zM5 22v4m5-4v4m5-4v4m5-4v4m5-4v4"/>
    </g>
    <g id="objy-arch-hot" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M3 5h16M3 12h12M3 19h16"/>
      <circle cx="23" cy="5" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="23" cy="19" r="1.5" fill="currentColor" stroke="none"/>
    </g>
    <g id="objy-arch-columns" stroke="currentColor" stroke-width="1.5">
