        <text x="44" y="168" data-copy="architecture-diagram.device-status">&quot;status&quot;: &quot;ready&quot;,</text>
        <text x="44" y="196" data-copy="architecture-diagram.device-battery">&quot;battery&quot;: 87</text>
        <text x="24" y="224" fill="#ccc5bb">}</text>
      </g>
