        <text x="44" y="140" font-size="19" fill="#c5dca5" data-copy="architecture-diagram.device-name">&quot;name&quot;: &quot;Survey drone&quot;,</text>
        <text x="44" y="168" font-size="19" fill="#c5dca5" data-copy="architecture-diagram.device-status">&quot;status&quot;: &quot;ready&quot;,</text>
