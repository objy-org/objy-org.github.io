      <text x="34" y="739" font-size="12" fill="#b2afaa" data-copy="storage-diagram.inside">Inside objy.db</text>
      <text x="326" y="739" text-anchor="end" font-size="10" fill="#b2afaa" data-copy="storage-diagram.memory">IN MEMORY</text>
      <g class="storage-tier" transform="translate(34 751)">
