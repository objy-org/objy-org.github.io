<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <!-- Four prominent capabilities share one small API connection. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#746f68" stroke-width="1.4">
      <path d="M219 138c0 15 12 22 23 22m36 0c11 0 23-7 23-22"/>
      <path d="M219 180c0-13 12-20 23-20m36 0c11 0 23 7 23 20"/>
    </g>
    <text x="260" y="166" fill="#b5ada3" font-family="Montserrat, Arial, sans-serif" font-size="16" text-anchor="middle" data-copy="api-diagram.interface">API</text>

    <!-- Query: a large magnifying glass makes finding objects recognizable. -->
    <rect x="22" y="20" width="218" height="118" rx="15" fill="#2b3127" stroke="#93a77e" stroke-width="1.5"/>
    <circle cx="125" cy="60" r="17" stroke="#c6d9b0" stroke-width="2.7"/>
    <path d="m138 73 14 14" stroke="#c6d9b0" stroke-width="3"/>
    <path d="M118 59h14m-14 6h9" stroke="#91a77b" stroke-width="1.7"/>

    <!-- Vector: a highlighted point and its nearby neighbors. -->
    <rect x="280" y="20" width="218" height="118" rx="15" fill="#302a37" stroke="#a18abb" stroke-width="1.5"/>
    <circle cx="389" cy="63" r="24" stroke="#a990c2" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 5"/>
    <path d="m379 65 21-18m-21 18 27 11" stroke="#bda4d3" stroke-width="1.8"/>
    <circle cx="379" cy="65" r="6" fill="#d2bde8"/>
    <circle cx="400" cy="47" r="4" fill="#baa0d3"/>
    <circle cx="406" cy="76" r="4" fill="#baa0d3"/>
    <g fill="#8f79a2"><circle cx="364" cy="42" r="2.5"/><circle cx="421" cy="55" r="2.5"/><circle cx="368" cy="86" r="2.5"/></g>

    <!-- CRUD: create and remove controls leave room for a large label. -->
    <rect x="22" y="180" width="218" height="118" rx="15" fill="#352c27" stroke="#bc927f" stroke-width="1.5"/>
    <rect x="101" y="207" width="33" height="33" rx="9" fill="#42352c" stroke="#d5a58c" stroke-width="1.5"/>
    <path d="M109 223h17m-8-8v16" stroke="#efc3aa" stroke-width="2.5"/>
    <rect x="138" y="219" width="29" height="29" rx="8" fill="#302923" stroke="#bc927f" stroke-width="1.5"/>
    <path d="M146 233h13" stroke="#e4b69d" stroke-width="2.5"/>

    <!-- Aggregate: values combine into a simple summary chart. -->
    <rect x="280" y="180" width="218" height="118" rx="15" fill="#282f32" stroke="#829fa9" stroke-width="1.5"/>
    <path d="M366 242v-18m23 18v-36m23 36v-26" stroke="#bad2dc" stroke-width="7"/>
    <path d="M356 251h66" stroke="#819fa9" stroke-width="1.6"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">
    <text x="131" y="119" fill="#d0dfbb" data-copy="api-diagram.query">Query</text>
    <text x="389" y="119" fill="#d5c2e9" data-copy="api-diagram.vector">Vector</text>
    <text x="131" y="279" fill="#edc4af" data-copy="api-diagram.crud">CRUD</text>
    <text x="389" y="279" fill="#c6dbe3" data-copy="api-diagram.aggregate">Aggregate</text>
  </g>
</svg>
