<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- One object interface opens four ways to work with data. -->
    <path d="M214 164h42M256 164V58q0-8 8-8h42M256 164v98q0 8 8 8h42M256 122h50M256 196h50" stroke="#827c72" stroke-width="1.5"/>
    <circle cx="256" cy="164" r="3" fill="#d7b6a0"/>

    <path d="m40 92 10-8h174l-10 8Z" fill="#3d302a" stroke="#ab806e" stroke-width="1.3"/>
    <path d="m214 92 10-8v146l-10 8Z" fill="#2b2522" stroke="#ab806e" stroke-width="1.3"/>
    <rect x="40" y="92" width="174" height="146" rx="3" fill="#292624" stroke="#d0a18d" stroke-width="1.6"/>
    <path d="M40 126h174" stroke="#806353" stroke-width="1.2"/>
    <text x="57" y="115" fill="#d9b09a" font-family="Montserrat, Arial, sans-serif" font-size="17" letter-spacing="1.2" data-copy="api-diagram.interface">API</text>
    <circle cx="197" cy="109" r="3" fill="#b8cba0"/>
    <text x="127" y="197" fill="#ebc2b0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="46" text-anchor="middle">{ }</text>

    <!-- CRUD: an object can be added, edited, or removed. -->
    <rect x="308" y="29" width="42" height="42" rx="8" fill="#352c27" stroke="#c99a85" stroke-width="1.4"/>
    <path d="M317 42h12m-6-6v12M331 59h11" stroke="#edc0a9" stroke-width="1.8"/>
    <path d="m318 61 21-24" stroke="#c99a85" stroke-width="1" opacity=".45"/>

    <!-- Query: find matching objects. -->
    <rect x="308" y="101" width="42" height="42" rx="8" fill="#2d3528" stroke="#a1b78c" stroke-width="1.4"/>
    <circle cx="326" cy="119" r="8" stroke="#c4d7ae" stroke-width="1.8"/>
    <path d="m332 125 8 8" stroke="#c4d7ae" stroke-width="1.8"/>

    <!-- Aggregation: turn many values into a result. -->
    <rect x="308" y="175" width="42" height="42" rx="8" fill="#322c3b" stroke="#af97c8" stroke-width="1.4"/>
    <path d="M317 206v-10m12 10v-22m12 22v-16" stroke="#cab3e1" stroke-width="4"/>

    <!-- Vector search: find neighbors in a field of points. -->
    <rect x="308" y="249" width="42" height="42" rx="8" fill="#292e31" stroke="#91aab5" stroke-width="1.4"/>
    <path d="m323 267 10-7m-10 7 13 10" stroke="#b7d0da" stroke-width="1.1"/>
    <circle cx="323" cy="267" r="4" fill="#b7d0da"/>
    <g fill="#91aab5"><circle cx="333" cy="260" r="2.5"/><circle cx="336" cy="277" r="2.5"/><circle cx="317" cy="280" r="2"/></g>

    <g font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#d7d0c6">
      <text x="367" y="56" data-copy="api-diagram.crud">CRUD</text>
      <text x="367" y="128" data-copy="api-diagram.query">Query</text>
      <text x="367" y="202" data-copy="api-diagram.aggregate">Aggregate</text>
      <text x="367" y="276" data-copy="api-diagram.vector">Vector</text>
    </g>
  </g>
</svg>
