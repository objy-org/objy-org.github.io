<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" fill="none">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- A new field floats into the object without changing its overall shape. -->
    <path d="M174 146c-29 17-39 40-34 65m-8-8 8 8 7-9" stroke="#a4b88f" stroke-width="2"/>
    <g transform="rotate(-7 173 99)">
      <rect x="36" y="51" width="274" height="98" rx="13" fill="#292f25" stroke="#829873" stroke-width="1.5"/>
      <circle cx="66" cy="81" r="12" fill="#a7c18e" fill-opacity=".12"/>
      <path d="M60 81h12m-6-6v12" stroke="#cfdfbd" stroke-width="2"/>
      <text x="90" y="88" fill="#ccdbbc" font-family="Montserrat, Arial, sans-serif" font-size="23" data-copy="capabilities-diagram.new-property">New property</text>
      <text x="57" y="123" fill="#b8cea5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" data-copy="capabilities-diagram.property">&quot;available&quot;: true</text>
    </g>

    <!-- The complete JSON object remains the visual center. -->
    <g transform="rotate(-4 257 343)">
      <path d="m74 211 13-11h346l-13 11Z" fill="#3b302b" stroke="#8d7569" stroke-width="1.3"/>
      <path d="m420 211 13-11v267l-13 11Z" fill="#302824" stroke="#8d7569" stroke-width="1.3"/>
      <rect x="74" y="211" width="346" height="267" rx="4" fill="#292624" stroke="#ba9585" stroke-width="1.6"/>
      <path d="M74 263h346" stroke="#58473e"/>
      <text x="100" y="245" fill="#e6c8b9" font-family="Montserrat, Arial, sans-serif" font-size="24" data-copy="capabilities-diagram.object">Your object</text>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23">
        <text x="100" y="301" fill="#bda99b">{</text>
        <text x="120" y="337" fill="#e3c9ba" data-copy="capabilities-diagram.identity">&quot;_id&quot;: &quot;bike-001&quot;,</text>
        <text x="120" y="373" fill="#bfd1ad" data-copy="capabilities-diagram.color">&quot;color&quot;: &quot;coral&quot;,</text>
        <rect x="112" y="387" width="280" height="35" rx="5" fill="#a58bbf" fill-opacity=".1"/>
        <text x="120" y="411" fill="#cebae1" data-copy="capabilities-diagram.owner">&quot;owner&quot;: { … }</text>
        <text x="100" y="448" fill="#bda99b">}</text>
      </g>
    </g>

    <!-- A live link resolves to a separate user object. -->
    <path d="M407 397c65-19 88-59 89-105m-7 9 7-9 7 9" stroke="#b39bc9" stroke-width="2.2"/>
    <text x="560" y="137" fill="#baa4cc" font-family="Montserrat, Arial, sans-serif" font-size="22" text-anchor="middle" data-copy="capabilities-diagram.reference">Live reference</text>
    <g transform="rotate(6 562 228)">
      <rect x="435" y="171" width="250" height="122" rx="13" fill="#2c2733" stroke="#9f86b7" stroke-width="1.5"/>
      <circle cx="474" cy="207" r="11" stroke="#cbb5df" stroke-width="1.8"/>
      <path d="M456 237c0-20 36-20 36 0" stroke="#cbb5df" stroke-width="1.8"/>
      <text x="507" y="218" fill="#dbcae8" font-family="Montserrat, Arial, sans-serif" font-size="23" data-copy="capabilities-diagram.user">User object</text>
      <text x="455" y="266" fill="#baa7cb" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" data-copy="capabilities-diagram.user-identity">&quot;_id&quot;: &quot;person-001&quot;</text>
    </g>

    <!-- User access is represented by a shield and two simple capabilities. -->
    <path d="M616 302c23 35 25 66 8 99m-3-11 3 11 11-4" stroke="#9c9c8c" stroke-width="1.8" stroke-dasharray="3 8"/>
    <g transform="rotate(4 563 463)">
      <rect x="433" y="411" width="260" height="104" rx="15" fill="#292d27" stroke="#829476" stroke-width="1.5"/>
      <path d="m471 436 21 8v19c0 13-10 23-21 29-11-6-21-16-21-29v-19Z" fill="#a3bc8c" fill-opacity=".08" stroke="#bdcead" stroke-width="1.8"/>
      <path d="m461 463 7 7 14-17" stroke="#d0dfbd" stroke-width="2.4"/>
      <text x="512" y="451" fill="#c5d2b8" font-family="Montserrat, Arial, sans-serif" font-size="23" data-copy="capabilities-diagram.permissions">Permissions</text>
      <text x="512" y="486" fill="#a8b79b" font-family="Montserrat, Arial, sans-serif" font-size="21" data-copy="capabilities-diagram.access">Read · Write</text>
    </g>
  </g>
</svg>
