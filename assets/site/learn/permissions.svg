<svg xmlns="http://www.w3.org/2000/svg" class="learn-permissions" width="100%" fill="none" font-family="Montserrat, Arial, sans-serif">
<style>
.learn-permissions { aspect-ratio: 520 / 350; }
.learn-permissions-compact { display: none; }
@media (max-width: 640px) {
  .learn-permissions { aspect-ratio: 360 / 350; }
  .learn-permissions-wide { display: none; }
  .learn-permissions-compact { display: block; }
}
@container (max-width: 480px) {
  .learn-permissions { aspect-ratio: 360 / 350; }
  .learn-permissions-wide { display: none; }
  .learn-permissions-compact { display: block; }
}
</style>
<defs>
  <g id="learn-permissions-person" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="0" cy="-10" r="10"/>
    <path d="M-21 22v-4a21 21 0 0 1 42 0v4"/>
  </g>
  <g id="learn-permissions-bike" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-22" cy="10" r="13"/><circle cx="27" cy="10" r="13"/>
    <path d="m-22 10 13-28L8 10h-30M-9-18H19l8 28M8 10l11-28-5-9h-9M-16-23h13"/>
  </g>
  <g id="learn-permissions-allow" stroke="#c5dca5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle r="11"/><path d="m-5 0 3 4 7-8"/>
  </g>
  <g id="learn-permissions-deny" stroke="#cba09a" stroke-width="1.8" stroke-linecap="round">
    <circle r="11"/><path d="m-4-4 8 8m0-8-8 8"/>
  </g>
</defs>
<svg class="learn-permissions-wide" viewBox="0 0 520 350" width="100%" height="100%" aria-hidden="true">
  <use href="#learn-permissions-person" x="260" y="31" color="#a9d0eb"/>
  <text x="260" y="83" text-anchor="middle" font-size="20" fill="#a9d0eb" data-copy="learn-diagrams.permission-user">Alex</text>
  <path d="M260 94v25m-5-5 5 5 5-5" stroke="#86867d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="260" y="145" text-anchor="middle" font-size="16" fill="#d6b5af" data-copy="learn-diagrams.permission-rule">Permission rule</text>
  <text x="260" y="172" text-anchor="middle" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#dedbd5" data-copy="learn-diagrams.permission-filter">owner.value = person-42</text>
  <text x="260" y="198" text-anchor="middle" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#cfb5ee" data-copy="learn-diagrams.permission-actions">r · u</text>
  <path d="M260 210v16H118v18m-5-5 5 5 5-5M260 226h142v18m-5-5 5 5 5-5" stroke="#86867d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#learn-permissions-bike" x="106" y="272" color="#c5dca5"/>
  <use href="#learn-permissions-allow" x="164" y="270"/>
  <use href="#learn-permissions-bike" x="390" y="272" color="#888a82"/>
  <use href="#learn-permissions-deny" x="448" y="270"/>
  <text x="118" y="313" text-anchor="middle" font-size="18" fill="#dedbd5" data-copy="learn-diagrams.permission-own-bike">Alex's bike</text>
  <text x="118" y="340" text-anchor="middle" font-size="17" fill="#c5dca5" data-copy="learn-diagrams.permission-allowed">Read + update</text>
  <text x="402" y="313" text-anchor="middle" font-size="18" fill="#aaa99f" data-copy="learn-diagrams.permission-other-bike">Another owner's bike</text>
  <text x="402" y="340" text-anchor="middle" font-size="17" fill="#d6b5af" data-copy="learn-diagrams.permission-denied">No access</text>
</svg>
<svg class="learn-permissions-compact" viewBox="0 0 360 350" width="100%" height="100%" aria-hidden="true">
  <use href="#learn-permissions-person" x="180" y="31" color="#a9d0eb"/>
  <text x="180" y="83" text-anchor="middle" font-size="21" fill="#a9d0eb" data-copy="learn-diagrams.permission-user">Alex</text>
  <path d="M180 94v25m-5-5 5 5 5-5" stroke="#86867d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="145" text-anchor="middle" font-size="18" fill="#d6b5af" data-copy="learn-diagrams.permission-rule">Permission rule</text>
  <text x="180" y="172" text-anchor="middle" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#dedbd5" data-copy="learn-diagrams.permission-filter">owner.value = person-42</text>
  <text x="180" y="198" text-anchor="middle" font-size="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#cfb5ee" data-copy="learn-diagrams.permission-actions">r · u</text>
  <path d="M180 210v16H88v18m-5-5 5 5 5-5M180 226h92v18m-5-5 5 5 5-5" stroke="#86867d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#learn-permissions-bike" x="76" y="272" color="#c5dca5"/>
  <use href="#learn-permissions-allow" x="134" y="270"/>
  <use href="#learn-permissions-bike" x="260" y="272" color="#888a82"/>
  <use href="#learn-permissions-deny" x="318" y="270"/>
  <text x="88" y="313" text-anchor="middle" font-size="20" fill="#dedbd5" data-copy="learn-diagrams.permission-own-bike">Alex's bike</text>
  <text x="88" y="340" text-anchor="middle" font-size="19" fill="#c5dca5" data-copy="learn-diagrams.permission-allowed">Read + update</text>
  <text x="272" y="313" text-anchor="middle" font-size="16" fill="#aaa99f" data-copy="learn-diagrams.permission-other-bike">Another owner's bike</text>
  <text x="272" y="340" text-anchor="middle" font-size="19" fill="#d6b5af" data-copy="learn-diagrams.permission-denied">No access</text>
</svg>
</svg>
