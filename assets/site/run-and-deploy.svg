    <path d="m24 116 8-7h146l-8 7Z" fill="#3d302a" stroke="#ab806e" stroke-width="1.3"/>
    <path d="m170 116 8-7v112l-8 7Z" fill="#2b2522" stroke="#ab806e" stroke-width="1.3"/>
    <rect x="24" y="116" width="146" height="112" rx="3" fill="#292624" stroke="#d0a18d" stroke-width="1.7"/>
    <path d="M24 140h146" stroke="#806353" stroke-width="1.2"/>
    <g fill="#b89583"><circle cx="36" cy="128" r="2.2"/><circle cx="45" cy="128" r="2.2"/><circle cx="54" cy="128" r="2.2"/></g>
    <path d="M72 128h78" stroke="#806353" stroke-width="1"/>
    <text x="97" y="196" fill="#ecc1ae" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="38" text-anchor="middle">{ }</text>

    <g color="#b9caa4" transform="translate(225 124)"><use href="#deployment-server"/></g>

    <!-- A shared network links every cluster member. -->
    <path d="M392 130v38h85v-38M434 168v25" stroke="#9c8aaf" stroke-width="1.6"/>
    <circle cx="434" cy="168" r="3" fill="#c6b0de"/>
    <g color="#bba7d1" transform="translate(370 59) scale(.68)"><use href="#deployment-server"/></g>
    <g color="#bba7d1" transform="translate(455 59) scale(.68)"><use href="#deployment-server"/></g>
    <g color="#c9b4df" transform="translate(412 193) scale(.68)"><use href="#deployment-server"/></g>
  </g>
