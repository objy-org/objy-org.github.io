<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <defs>
    <g id="deployment-server" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M0 0 10-8h64L64 0Z" fill="currentColor" fill-opacity=".19"/>
      <path d="m64 0 10-8v108l-10 8Z" fill="currentColor" fill-opacity=".07"/>
      <rect width="64" height="108" rx="2" fill="#252626"/>
      <g fill="currentColor" fill-opacity=".09">
        <rect x="10" y="12" width="44" height="24" rx="2"/>
        <rect x="10" y="43" width="44" height="24" rx="2"/>
        <rect x="10" y="74" width="44" height="24" rx="2"/>
      </g>
      <g fill="currentColor" stroke="none"><circle cx="19" cy="24" r="2.5"/><circle cx="19" cy="55" r="2.5"/><circle cx="19" cy="86" r="2.5"/></g>
      <path d="M30 21h15m-15 6h15m-15 25h15m-15 6h15m-15 25h15m-15 6h15" stroke-width="1.2" stroke-opacity=".55"/>
    </g>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- A browser, a single machine, and three machines in a connected cluster. -->
    <g stroke="#8e8578" stroke-width="1.6">
      <path d="M185 174h25m-6-6 6 6-6 6"/>
      <path d="M307 174h35m-6-6 6 6-6 6"/>
